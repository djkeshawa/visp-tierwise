# tierwise:recommended
#
# Built-in preset for most teams. It declares two kinds, the naming patterns of
# requirements section 4.9 (declared as LINT-14 requires), and the strict lint
# severities of requirements section 6.3. It declares no engine behaviour: it
# cannot disable an engine error (LINT-8, LINT-9). See README.md in this directory.

kinds:
  # Ordinary settings that teams tune per scope. Only order-dependent strategies
  # are allowed (KIND-10), and require_default makes the default mandatory (KIND-8).
  # A source failure at a service-sourced level contributes nothing under skip
  # (SVC-8).
  configuration:
    strategies: [override, deep_merge]
    require_default: true
    on_source_failure: skip

  # Narrowing permissions. Only narrowing strategies are allowed (KIND-5, MERGE-2),
  # so authored values may not equal the strategy identity (KIND-6). A source that
  # cannot be read denies the capability at a service-sourced level (SVC-9, SVC-11). A
  # min key settable at such a level must declare the min bound of its integer type
  # (SVC-12).
  # Its keys must match the capability_key pattern below (KIND-12, LINT-16).
  capability:
    strategies: [all, intersect, min]
    narrowing_only: true
    on_source_failure: deny
    naming: capability_key

naming:
  key:
    category: key
    pattern: '^[a-z]+(\.[a-z_]+){2}$'
    description: "Keys have three dot-separated segments. The first is lowercase letters. The other two are lowercase letters and underscores."

  capability_key:
    category: key
    pattern: '\.(allowed|allow_[a-z_]+|allowed_[a-z_]+)$'
    description: "Keys of the capability kind end in allowed, allow_<name> or allowed_<name>."

  enum_value:
    category: enum_value
    pattern: '^[A-Z][A-Z0-9_]*$'
    description: "Enum values are upper-case letters, digits and underscores, starting with a letter."

  node_id:
    category: node_id
    pattern: '^[a-z][a-z0-9_]*$'
    description: "Node IDs are lowercase letters, digits and underscores, starting with a letter."

  feature:
    category: feature
    pattern: '^[a-z]+\.[a-z_]+$'
    description: "Feature names are a lowercase first segment, a dot, and a lowercase name with underscores."

# schema/owner-required reports nothing unless the manifest declares at least one
# namespace (LINT-46, LINT-47).
lint:
  rules:
    "naming/*": error
    values/no-op: error
    rules/dead-rule: warn
    examples/required-per-binding: error
    examples/mixed-collection: warn
    schema/unused: warn
    schema/description-required: warn
    schema/owner-required: error
    presets/override: info
