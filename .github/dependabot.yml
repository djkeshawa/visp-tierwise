version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: maven
    directory: /java
    schedule:
      interval: weekly
    ignore:
      # Maven 3.10 leaves local-repository files in the Central bundle and Central rejects it (ADR 0030).
      - dependency-name: org.apache.maven:apache-maven
        versions: ['>= 3.10.0']
  - package-ecosystem: npm
    directory: /js
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
