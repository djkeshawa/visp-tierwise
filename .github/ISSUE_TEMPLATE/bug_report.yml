name: Bug report
description: Report an unexpected result or build failure.
title: '[Bug] '
body:
  - type: markdown
    attributes:
      value: For vulnerabilities, use the private reporting process in SECURITY.md.
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include a public, synthetic bundle/context or reproducible commands.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Include package/spec/bundle versions and any provenance or error codes.
    validations:
      required: true
