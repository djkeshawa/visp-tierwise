# Enforcers for work item C2 (compile cases: hierarchy, scopes and entities), VEC-125.
# Every SCOPE and ENTITY clause that a compile case can observe is cited by one, and SCOPE-37 is
# already listed by E4. ENTITY-10 (the ancestor closure) is cited by hierarchy-entity-graph-ancestor-and-child.

# A root level that is listed in axes is a repeated name under SCOPE-3 and SCOPE-4, so SCOPE-11 gives E_SCOPE_DECLARATION.
# The same declaration also breaks SCOPE-14 (an axis without a scopes entry) or SCOPE-12 (a scopes entry for the root
# level), and no clause says whether a compiler reports those findings in addition. The set comparison of VEC-98
# cannot tell the outcomes apart, so no compile case is written (VEC-114 spirit) until the spec settles the finding set.
SCOPE-11: "Java: tierwise-core RootLevelAxisTest#SCOPE_11_theRootLevelListedInAxesIsEScopeDeclaration, #SCOPE_11_theRootLevelListedInAxesWithAScopesEntryIsStillOnlyEScopeDeclaration, #SCOPE_11_aHierarchyWithOnlyARootLevelThatIsAlsoAnAxisIsEScopeDeclaration. They require every finding to be E_SCOPE_DECLARATION, none to be E_DUPLICATE_DEFINITION, and one at the repeated axis item; they do not compare the whole finding set."
