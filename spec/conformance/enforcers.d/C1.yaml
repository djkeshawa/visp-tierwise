# Enforcers for clauses of the MANIFEST, SRC, NS and FIND areas that no compile case of work item C1
# observes (VEC-125). Each key is a clause ID. Each value is one line that names the enforcer.
# A value that says "Planned" names a test that is not written yet, so it is a promise to test the clause.

# Runner behaviour: finding lists are compared as sets (VEC-98), so repeated runs are checked by the runner.
FIND-4: "Java: tierwise-core FindingContractTest#FIND_4_engineFindingsHaveTheSameKeysAndSeveritiesWhateverTheOrderOfFilesAndPatterns, #FIND_4_lintFindingsHaveTheSameKeysAndSeveritiesWhateverTheOrderOfFilesAndPatterns, #FIND_4_aRepeatedRunGivesTheSameFindings."

# Evaluation is not validation, and the evaluate vectors cover the error path (FIND-9, EVAL-22).
FIND-9: "Java: tierwise-core EvaluationNotValidationTest#FIND_9_everyFailingResolveRaisesAnEvaluationError, #FIND_9_everyFailingDecideRaisesAnEvaluationError, #FIND_9_aResultHasNoFindings, #FIND_9_theEvaluatorInterfaceOffersNoValidation, #FIND_9_theEvaluatorCodeUsesNoValidationCode. JS: @visplabs/evaluator test/evaluation-not-validation.test.mjs (the eight tests named 'FIND-9: ...')."

# Finding fields other than the finding key are not compared by the suite (VEC-101).
FIND-10: "Java: tierwise-core FindingContractTest#FIND_10_everyEngineFindingHasCodeSeverityFilePathLineAndMessage, #FIND_10_everyLintFindingHasCodeSeverityFilePathLineAndMessage."
FIND-11: "Java: tierwise-core FindingContractTest#FIND_11_aFindingMayOmitTheSuggestionAndAPresentSuggestionIsNotPartOfTheKey."
FIND-15: "Java: tierwise-core FindingContractTest#FIND_15_everyEngineFindingHasSeverityErrorWhateverTheLintSettingsAre, #FIND_15_anEngineFindingAfterTheLoaderAlsoHasSeverityErrorWhenASettingNamesItsCode."
FIND-16: "Java: tierwise-core FindingContractTest#FIND_16_eachLintFindingCarriesTheResolvedSeverityOfItsRule, #FIND_16_theSeverityIsTheOneResolvedAcrossPresetAndManifest, #FIND_16_aRuleThatResolvesToOffReportsNothing."
FIND-25: "Java: tierwise-core FindingContractTest#FIND_25_twoChecksWithTheSameFindingKeyReportOneFinding, #FIND_25_twoFindingsThatDifferOnlyInCodeOrLineAreTwoFindings."
FIND-26: "Java: tierwise-core FindingContractTest#FIND_26_theValidationListsItsFindingsByFileLinePathAndCode, #FIND_26_theFindingsOfARealProjectAreInTheOrderOfFind26."
FIND-28: "Java: tierwise-core FindingContractTest#FIND_28_aSuggestionIsTheExactTextOfADeclaredNameOfTheMatchingCategory, #FIND_28_aSuggestionForAnUnknownKindIsADeclaredKindName, #FIND_28_aSuggestionForAnUnknownLintRuleIsARuleIdentifier."

# Specification-review rule and the explain command (FIND-14, FIND-29, FIND-30).
FIND-14: "Specification-review rule: a code keeps its meaning in later versions. It is checked when the catalogue changes, not by a runner."
FIND-29: "Java: tierwise-cli ExplainCatalogueTest#FIND_29_everyEngineCodeAndLintRuleHasAnEntryWithTheRationaleAndTheFix, #FIND_29_explainPrintsTheCatalogueEntryOfEveryCodeAndRule."
FIND-30: "Java: tierwise-cli ExplainNamingRuleTest#FIND_30_aPatternWithADescriptionIsExplainedByItsDescription, #FIND_30_aPatternWithoutADescriptionIsExplainedByTheFamilyFollowedByThePattern, #FIND_30_aPatternFromAPresetIsExplainedAndALaterLayerReplacesIt, #FIND_30_aProjectWithErrorFindingsStillExplainsThePatternsItCouldRead, #FIND_30_aNamingRuleThatTheProjectDoesNotDeclareExitsWithOneAndSuggestsACloseName, #FIND_30_withoutAProjectTheFamilyEntryIsPrintedWithANoteThatThePatternNeedsAProject; tierwise-core NamingPatternsTest (ADR 0026)."

# A URL preset and a path outside the project root are not expressible in a compile case: VEC-92 forbids
# a case from naming a path that resolves outside its project root (MANIFEST-12).
MANIFEST-12: "Java: tierwise-core ManifestPathEscapeTest (seven MANIFEST_12 tests: a values file, a namespace schema, glob matches, a path-mapped match and a preset directory reached through symbolic links, and the accepted inside cases), PresetRulesTest#MANIFEST_12_aSymbolicLinkToAFileOutsideTheProjectRootIsEManifest, SourceSelectionTest#MANIFEST_12_aGlobMatchThatResolvesOutsideTheProjectRootIsEManifestAtThePattern."

# Retrieval of URL presets needs a fake retrieval interface, which the suite cannot serve (MANIFEST-27 note).
MANIFEST-28: "Java: tierwise-core UrlPresetDigestTest#MANIFEST_28_retrievedBytesWhoseDigestDiffersAreEPresetAtTheExtendsItem, #MANIFEST_28_theDigestIsComputedOverTheExactRetrievedBytes, #MANIFEST_28_bytesThatMatchTheDigestAreAccepted (fake retrieval through the PresetFetcher of CompileOptions)."
MANIFEST-29: "Java: tierwise-core UrlPresetDigestTest#MANIFEST_29_aPresetWhoseDigestDoesNotMatchContributesNothing, #MANIFEST_29_theContentIsNotInterpretedBeforeTheDigestCheck (fake retrieval through the PresetFetcher of CompileOptions)."

# A replaced kind keeps none of the earlier definition's fields. No compile case in C1 exercises it (MANIFEST-33).
MANIFEST-33: "Java: tierwise-core KindReplacementTest#MANIFEST_33_anEmptyReplacementKeepsNoFieldOfTheReplacedKind, #MANIFEST_33_aPartialReplacementKeepsOnlyItsOwnFields, #MANIFEST_33_aKeyThatUsesTheReplacedKindIsCheckedOnlyAgainstTheReplacement, #MANIFEST_33_theSameKeyUnderTheUnreplacedKindShowsTheFieldsOfThePreset, #MANIFEST_33_aKindReplacedByASecondPresetKeepsNoFieldOfTheFirst."

