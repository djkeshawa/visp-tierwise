# the flat directories valid-*, type-*, value-*, key-*, axis-*, merge-* and deep-* under spec/conformance/compile/,
# so it is not listed here. Only data-file rules remain, and two duplicate rules whose finding location the spec
# does not fix. Entries that say "Planned" name a test that is not written yet.

# The format of the tz name file is a property of the data file, not of any compile result.
TYPE-36: "Spec tool: js/spec-tools/test/tz-names.test.mjs, the four tests named 'TYPE-36: ...' (UTF-8 without a byte-order mark and with LF endings; one name per line, no comment or blank line; code-point order; the spec/spec.md constant names the release that TYPE-80 names)."

# The content of the tz name file is the Zone and Link list of one release, which no compile result exposes.
TYPE-80: "Opt-in spec-tool test: js/spec-tools/test/tz-names.test.mjs 'TYPE-80: tz-names.txt lists exactly the Zone and Link names of the pinned release' runs only when TIERWISE_TZDATA_DIR names an extracted tzdata release and is skipped otherwise, so CI does not enforce it; its parser test runs every time."

# A key name declared in two files has no first or second declaration, because SRC-37 makes file order irrelevant, and no clause names the node that the finding is located at. The compile cases src-key-declared-twice-files and src-key-declared-twice-preset exercise the same rule through SRC-40 with a stated convention.
KEY-1: "Java: tierwise-core KeyDuplicateTest#KEY_1_aKeyDeclaredInTwoSchemaFilesIsEDuplicateDefinition, #KEY_1_anIdenticalSecondDeclarationIsStillADuplicate, #KEY_1_aKeyDeclaredInAPresetAndInTheProjectIsADuplicate, #KEY_1_aKeyDeclaredInlineAndInAFileIsReportedInTheFile."

# Two values for one key at one scope and node from two files have no first or second value, and no clause names the node that the finding is located at. The set comparison of VEC-98 would depend on that choice.
KEY-12: "Java: tierwise-core KeyDuplicateTest#KEY_12_aRootValuesFileAndARootEntryOfAMultiNodeFileAreEDuplicateValue, #KEY_12_aPathMappedFileAndAMultiNodeFileForOneNodeAreEDuplicateValue, #KEY_12_twoMultiNodeFilesWithTheSameNodeAreEDuplicateValue, #KEY_12_inlineValuesAndAValuesFileForOneNodeAreReportedInTheFile, #KEY_12_everyValueAfterTheFirstGetsOneFinding."
