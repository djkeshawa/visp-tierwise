# Enforcers for work item E6 (FactSet, effect and operation-error vectors), VEC-125.
# Each key is a normative clause ID in the FACT, NORM, FEAT or EVAL areas that no vector can observe.
# Each value is one line that names the enforcer. Entries that say "Planned" name a test that is not written yet.

# A fact's source member is documentation only. Bundles drop it (BUNDLE-109), so no bundle carries it into an evaluate vector.
# The compile side is observed by compile cases that compile a fact with a source member to a bundle without it (VEC-94). This entry supplements them.
FACT-10: "Java: tierwise-core FactSourceTest#FACT_10_aBundleThatCarriesAFactSourceIsRejectedWhateverItsText, #FACT_10_theEvaluatorValidatesAFactByItsTypeAlone, FactSetValidatorTest#FACT_10_onlyTheTypeOfAFactDeclarationIsUsedToValidate. JS: js/evaluator/test/bundle-load-structure.test.mjs \"FACT-10: a bundle cannot carry the source member of a fact, so the evaluator validates a fact by its type alone\". The compile side is observed by compile cases (VEC-94)."

# Repeated FactSet entry names. Every vector file, FactSets included, is read by the strict YAML loader of the check tool.
FACT-34: "Check tool: spec-tools loadYamlFile rejects a repeated mapping key in every vector file, FactSets included, with E_DUPLICATE_KEY (VEC-7, SRC-3). Runners apply the same SRC rules to vector files (VEC-7)."

# An unpaired surrogate cannot be written as a character in a UTF-8 vector file (VEC-6). It could be written only as a YAML escape such as \uD800.
# VEC-6 and VEC-7 do not settle whether a vector may use that escape, and the check tool's loader accepts it, so the suite carries no such vector (open point of E6, see README-edge-facts.md).
NORM-8: "Java: tierwise-core FactSetValidatorTest#NORM_8_aFactSetStringWithAnUnpairedSurrogateIsInvalid, RuntimeValuesTest#NORM_8_aStringWithAnUnpairedSurrogateIsInvalid. JS: js/evaluator/test/evaluator.test.mjs \"a FactSet with a string with an unpaired surrogate raises E_FACTS_INVALID (FACT-22 to FACT-42)\". The suite carries no such string, because a vector file cannot hold one as UTF-8 text (VEC-6) and no clause settles whether the YAML escape form is allowed."

# Values of different declared types. FACT-35 rejects a value of the wrong type before any comparison, so no vector reaches one.
NORM-18: "Java: tierwise-core ValueEqualityTest#NORM_18_valuesOfDifferentTypesAreNeverEqual, EffectEqualityTest#NORM_18_valuesOfDifferentTypesAreNeverEqual. JS: js/evaluator/test/value-equality.test.mjs \"NORM-18: values of different declared types never compare equal\". FACT-35 rejects a wrong-type FactSet value first, so no decision vector reaches such a comparison."

# Equality of set, list and object values. Conditions compare scalars only (RULE-35 to RULE-38), so no decision vector compares these.
# Compile cases observe object equality, ignoring field order, through the object-valued example effects of POL-41 and POL-48. This entry supplements them.
NORM-19: "Java: tierwise-core ValueEqualityTest (the NORM_19 tests), EffectEqualityTest#NORM_19_setsAreEqualWhenTheyHaveTheSameElementsInAnyOrder, #NORM_19_listsAreEqualForTheSameLengthAndEqualElementsAtEachPosition, #NORM_19_nestedObjectsAreEqualForTheSameFieldsWhateverTheFieldOrderAndCompareTheirMembersByType, #NORM_19_aListOfObjectsComparesEachElementUnderItsOwnType. JS: not applicable, because the evaluator compares scalars only (RULE-35 to RULE-38) and JS never compiles sources in v1. Compile cases with object-valued example effects observe object equality (POL-41, POL-48)."

# A context that is present but is not a map. The vector schema admits only a mapping for context (VEC-28), so no vector can pass another value.
EVAL-31: "Java: tierwise-core ContextValidatorTest#EVAL_31_aContextThatIsNotAMapRaisesContextInvalid. JS: js/evaluator/test/evaluator.test.mjs \"a context with a list raises E_CONTEXT_INVALID\", \"a context with a string raises E_CONTEXT_INVALID\", \"a context with a number raises E_CONTEXT_INVALID\". The vector schema admits only a mapping (VEC-28)."

# The raised error codes. Vectors cannot observe a code that an operation raises outside its triggers, so the raising sites are unit tests.
EVAL-38: "Check tool: spec-tools checkEnums compares the errorCode enum of vector-evaluate.schema.json with the evaluation codes of error-codes.md. Java: tierwise-core EvaluationErrorCodesTest#EVAL_38_theEvaluationCodesAreExactlyTheEleven, #EVAL_38_loadBundleRaisesOnlyIntegrityAndUnsupported, #EVAL_38_createEvaluatorRaisesOnlyEvaluatorOptionsAndProviderMissing, #EVAL_38_resolveResolveLocalAndDecideRaiseOnlyTheCodesOfTheirTriggers, #EVAL_38_eachOperationReachesEachOfItsCodesAtItsTrigger. JS: js/evaluator/test/evaluation-error-codes.test.mjs \"EVAL-38: the package declares exactly the eleven evaluation codes\", \"EVAL-38: load bundle raises only E_BUNDLE_INTEGRITY and E_BUNDLE_UNSUPPORTED (EVAL-24, EVAL-25)\", \"EVAL-38: create evaluator raises only E_EVALUATOR_OPTIONS and E_PROVIDER_MISSING (EVAL-26 to EVAL-28)\", \"EVAL-38: resolve, resolveSync, decide and decideSync raise only the codes of their triggers (EVAL-29 to EVAL-37)\", \"EVAL-38: each operation reaches each of its own codes at its trigger\"."
