# Enforcers for work item E7 (bundle loading, determinism and the load part of evaluation), VEC-125.
# Each key is a normative clause ID that no vector can observe, under VEC-72 and the closed fault list of VEC-71 and VEC-80
# (ADR 0016). Each value is one line that names the enforcer. Entries that say "Planned" name a test that is not written yet.

# Byte-level faults are outside the suite (VEC-72). The check tool rejects them in bundles/, and the loader rule is a unit test.
BUNDLE-3: "Check tool: spec-tools checkBundle rejects a bundle under bundles/ that begins with a byte-order mark. Java: tierwise-core BundleLoadIntegrityTest#BUNDLE_3_rejectsByteOrderMark, BundleReaderTest#BUNDLE_3_byteOrderMarkIsIntegrity. JS: js/evaluator/test/bundle-load-integrity.test.mjs \"BUNDLE-3: a bundle that begins with a byte-order mark raises E_BUNDLE_INTEGRITY\"."
BUNDLE-13: "Check tool: spec-tools parseBundleJson rejects a bundle under bundles/ with an unpaired surrogate. Java: tierwise-core BundleLoadIntegrityTest#BUNDLE_13_rejectsEscapedUnpairedSurrogate. JS: js/evaluator/test/bundle-load-integrity.test.mjs \"BUNDLE-13: an escaped unpaired surrogate raises E_BUNDLE_INTEGRITY\"."

# BUNDLE-116 is cited by the number vectors, which observe only its non-integer and out-of-range cases. The other cases are byte or envelope faults outside the suite (VEC-72, VEC-71, VEC-80).
BUNDLE-116: "Check tool: spec-tools checkBundle enforces canonical bytes (BUNDLE-2) for files under bundles/. Java: tierwise-core BundleLoadIntegrityTest#BUNDLE_116_rejectsInputThatIsNotUtf8, #BUNDLE_116_rejectsInputThatIsNotWellFormedJson, #BUNDLE_116_rejectsEnvelopeWithoutBundleVersionOrContent, #BUNDLE_116_BUNDLE_11_rejectsNegativeZeroFractionAndExponentEvenForAnIntegralValue, #BUNDLE_116_BUNDLE_12_rejectsIntegerOutsideTheSafeRange, #BUNDLE_116_BUNDLE_2_rejectsBytesThatAreNotExactlyTheJcsSerialisation, #BUNDLE_116_rejectsUpperCaseEscapeOfAControlCharacter. JS: js/evaluator/test/bundle-load-integrity.test.mjs \"BUNDLE-116: input that is not UTF-8 raises E_BUNDLE_INTEGRITY\", \"BUNDLE-116: input that is not well-formed JSON raises E_BUNDLE_INTEGRITY\", \"BUNDLE-116: an envelope that lacks bundleVersion or content raises E_BUNDLE_INTEGRITY\", \"BUNDLE-116, BUNDLE-11: -0, a fraction or an exponent raises E_BUNDLE_INTEGRITY, even for an integral value\", \"BUNDLE-116, BUNDLE-12: an integer outside +/-(2^53 - 1) raises E_BUNDLE_INTEGRITY\", \"BUNDLE-116, BUNDLE-2: bytes that are not exactly the JCS serialisation raise E_BUNDLE_INTEGRITY\", \"BUNDLE-116: an upper-case \\u escape of a control character is not the canonical form\"."

# Order of checks when a bundle fails more than one check. VEC-69 allows one fault per invalid bundle file, and VEC-22 and VEC-23 allow a bundle path only in bundles/ or bundles/invalid/, so no vector can hold two faults.
BUNDLE-117: "Java: tierwise-core BundleLoadIntegrityTest#BUNDLE_117_parseOrEnvelopeFaultWinsOverUnsupportedVersion, #BUNDLE_117_unsupportedVersionWinsOverDigestAndStructure, #BUNDLE_117_digestMismatchIsReportedBeforeAStructuralFault, #BUNDLE_117_faultsOfEveryStepRaiseTheCodeOfStepOne. JS: js/evaluator/test/bundle-load-integrity.test.mjs \"BUNDLE-117: a parse or envelope fault (step 1) wins over an unsupported version (step 2)\", \"BUNDLE-117: an unsupported version (step 2) wins over a digest mismatch (step 3) and a structural fault (step 4)\", \"BUNDLE-117: a digest mismatch (step 3) is reported before a structural fault (step 4)\", \"BUNDLE-117: a fault of every step at once raises the code of step 1\"."

# Structural loader faults (ADR 0016). No invalid-bundle file holds these faults in v0.1, so evaluator unit tests cover them.
