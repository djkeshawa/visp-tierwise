# Enforcers for work item E7 (bundle loading, determinism and the load part of evaluation), VEC-125.
# Each key is a normative clause ID that no vector can observe, under VEC-72 and the closed fault list of VEC-71 and VEC-80
# (ADR 0016). Each value is one line that names the enforcer. Entries that say "Planned" name a test that is not written yet.

# Byte-level faults are outside the suite (VEC-72). The check tool rejects them in bundles/, and the loader rule is a unit test.
BUNDLE-3: "Check tool: spec-tools checkBundle rejects a bundle under bundles/ that begins with a byte-order mark. Planned evaluator unit test: load bundle raises E_BUNDLE_INTEGRITY for such bytes (BUNDLE-116)."
BUNDLE-13: "Check tool: spec-tools parseBundleJson rejects a bundle under bundles/ with an unpaired surrogate. Planned evaluator unit test: load bundle raises E_BUNDLE_INTEGRITY for an escaped unpaired surrogate (BUNDLE-116)."

# BUNDLE-116 is cited by the number vectors, which observe only its non-integer and out-of-range cases. The other cases are byte or envelope faults outside the suite (VEC-72, VEC-71, VEC-80).
BUNDLE-116: "Check tool: spec-tools checkBundle enforces canonical bytes (BUNDLE-2) for files under bundles/. Planned evaluator unit test: load bundle raises E_BUNDLE_INTEGRITY for input that is not UTF-8, is not well-formed JSON, lacks bundleVersion or content, has the number -0 or a fraction or exponent form (BUNDLE-11), or is not exactly the JCS serialisation."

# Order of checks when a bundle fails more than one check. VEC-69 allows one fault per invalid bundle file, and VEC-22 and VEC-23 allow a bundle path only in bundles/ or bundles/invalid/, so no vector can hold two faults.
BUNDLE-117: "Planned evaluator unit test: a bundle that fails several checks raises the code of the first failing check in the order of EVAL-14."

# Structural loader faults (ADR 0016). No invalid-bundle file holds these faults in v0.1, so evaluator unit tests cover them.
BUNDLE-118: "The deny faults of SVC-11 and SVC-12 are observed by the load vectors deny-non-narrowing and deny-min-without-bound. Planned evaluator unit test for the rest: load bundle raises E_BUNDLE_INTEGRITY for a content member or value that breaks the forms of BUNDLE-14 to BUNDLE-108, excluding BUNDLE-16, BUNDLE-17 and BUNDLE-18, which BUNDLE-115, BUNDLE-137 and EVAL-56 govern."
BUNDLE-119: "Planned evaluator unit test: load bundle raises E_BUNDLE_INTEGRITY for a nodes, requiredFacts or when array that is not in code point order (DET-6)."
BUNDLE-120: "Planned evaluator unit test: load bundle raises E_BUNDLE_INTEGRITY for a fact name in a condition, a setting or requiredFacts that the bundle does not declare."
BUNDLE-121: "Planned evaluator unit test: load bundle raises E_BUNDLE_INTEGRITY for an entity name in decidedPer, a fact entity, belongsTo or hasMany that the bundle does not declare."
BUNDLE-122: "Planned evaluator unit test: load bundle raises E_BUNDLE_INTEGRITY for a fact member whose entity differs from the prefix of its name."
BUNDLE-123: "Planned evaluator unit test: load bundle raises E_BUNDLE_INTEGRITY for a binding whose policy the same feature does not declare."
BUNDLE-124: "Planned evaluator unit test: load bundle raises E_BUNDLE_INTEGRITY for a binding setting that its policy does not declare."
BUNDLE-125: "Planned evaluator unit test: load bundle raises E_BUNDLE_INTEGRITY for a setting reference in a condition that names no setting of the same policy."
BUNDLE-126: "Planned evaluator unit test: load bundle raises E_BUNDLE_INTEGRITY for a setting reference in a position that RULE does not allow, including inside a literal list."
BUNDLE-127: "Planned evaluator unit test: load bundle raises E_BUNDLE_INTEGRITY for a scope name that the hierarchy does not declare, or a non-level name in bindings or bindingSettableAt."
BUNDLE-128: "Planned evaluator unit test: load bundle raises E_BUNDLE_INTEGRITY for a bindingSettableAt that omits the root level or names a service-sourced level."
BUNDLE-129: "Planned evaluator unit test: load bundle raises E_BUNDLE_INTEGRITY for a node key that a closed catalog does not admit, an empty node key under a non-root scope, or an empty node ID in a nodes array."
BUNDLE-130: "Planned evaluator unit test: load bundle raises E_BUNDLE_INTEGRITY for a values key that the bundle does not declare, or whose settableAt does not include the scope it sits under."
BUNDLE-131: "Planned evaluator unit test: load bundle raises E_BUNDLE_INTEGRITY for a value that is not valid for its key type, or a setting default or binding value that is not valid for its fact type."
BUNDLE-132: "Planned evaluator unit test: load bundle raises E_BUNDLE_INTEGRITY for two rules of one policy that share an id."
BUNDLE-133: "Planned evaluator unit test: load bundle raises E_BUNDLE_INTEGRITY for a nodes array or listOf value that repeats an element."
BUNDLE-134: "Planned evaluator unit test: load bundle raises E_BUNDLE_INTEGRITY for a set value that repeats a member or has a member outside the universe of its type."
BUNDLE-135: "Planned evaluator unit test: load bundle raises E_BUNDLE_INTEGRITY for a decimal string that is not in canonical form."
BUNDLE-136: "Planned evaluator unit test: load bundle raises E_BUNDLE_INTEGRITY for a policy whose requiredFacts is not the distinct fact names of its rules, in code point order."

# Determinism rules that concern environment, not bytes (DET-7, DET-8). A vector cannot run under another locale or clock.
DET-7: "Planned evaluator unit test: loading and evaluating under a non-English locale and a non-UTC time zone gives the same results."
DET-8: "Planned evaluator unit test: loading and evaluating the same bytes gives the same results whatever the wall-clock time, the host environment and the iteration order of the input maps."

# Evaluation load rules that concern the API, not a result (EVAL-3, EVAL-55).
EVAL-3: "Planned evaluator API unit test: load bundle returns its loaded bundle or raises, with no promise, callback or other asynchronous step."
EVAL-55: "Planned evaluator API unit test: no public operation accepts a bundle value other than one that load bundle returned."
