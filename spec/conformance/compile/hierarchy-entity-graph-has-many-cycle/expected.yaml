id: hierarchy-entity-graph-has-many-cycle
specVersion: "0.1"
clauses: ["ENTITY-15", "ENTITY-17"]
description: "A has_many cycle between two entities is E_ENTITY_GRAPH, reported at the entity declared first on the cycle."
expect:
  findings:
    - code: E_ENTITY_GRAPH
      file: "schema/hierarchy.yaml"
      path: ["entity_hierarchy", "alpha"]
      line: 4
