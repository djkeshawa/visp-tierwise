id: lint-presets-override-three-layers
specVersion: "0.1"
clauses: [LINT-49, LINT-50, MANIFEST-31, MANIFEST-32]
description: "A name defined in three layers gives two presets/override findings, one at each replacing definition."
expect:
  findings:
    - code: presets/override
      file: "tierwise:entitlements"
      path: [naming, enum_value]
      line: 54
    - code: presets/override
      file: "tierwise:entitlements"
      path: [naming, feature]
      line: 64
    - code: presets/override
      file: "tierwise:entitlements"
      path: [naming, key]
      line: 34
    - code: presets/override
      file: "tierwise:entitlements"
      path: [naming, node_id]
      line: 59
    - code: presets/override
      file: "schema/core.yaml"
      path: [naming, enum_value]
      line: 43
    - code: presets/override
      file: "schema/core.yaml"
      path: [naming, feature]
      line: 51
    - code: presets/override
      file: "schema/core.yaml"
      path: [naming, key]
      line: 35
    - code: presets/override
      file: "schema/core.yaml"
      path: [naming, node_id]
      line: 47
