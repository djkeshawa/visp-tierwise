id: integer-range-precedence
specVersion: "0.1"
clauses: [RULE-20, RULE-28]
description: "An integer literal beyond the supported range is reported as E_INTEGER_RANGE, which takes precedence over E_ILLEGAL_FACT_VALUE for the same literal."
expect:
  findings:
    - code: E_INTEGER_RANGE
      file: rules/checkout.order_submission.yaml
      path: ["policies", "credit_check", "rules", 2, "when", "order.lines"]
      line: 21
