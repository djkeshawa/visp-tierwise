id: pol-duplicate-rules-file
specVersion: "0.1"
clauses: [POL-5, SRC-44, SRC-37, FIND-34]
description: "Two rules files that name the same feature are a duplicate definition, reported at the feature entry of the later file in path order. OPEN: which file is the second."
expect:
  findings:
    - code: E_DUPLICATE_DEFINITION
      file: "rules/zz-quote-copy.yaml"
      path: ["feature"]
      line: 1
