id: pol-setting-undeclared-fact
specVersion: "0.1"
clauses: [POL-14]
description: "A setting whose value_of names an undeclared fact is an unknown fact."
expect:
  findings:
    - code: E_UNKNOWN_FACT
      file: "rules/checkout.order_submission.yaml"
      path: ["policies", "credit_check", "settings", "extra_check", "value_of"]
      line: 7
