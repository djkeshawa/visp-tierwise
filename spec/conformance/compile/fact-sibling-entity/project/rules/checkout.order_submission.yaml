feature: checkout.order_submission

policies:
  credit_check:
    settings:
      allowed_on_credit_hold: { list_of: item.stock_type, default: [] }
      hold_state: { value_of: customer.credit_hold, default: true }
      held_flag: { value_of: customer.credit_hold, default: false }
    default: DENY
    rules:
      - id: good-credit
        name: Good credit
        when: { warehouse.open: true, customer.credit_hold: false }
        then: ALLOW
      - id: credit-hold-allowed-stock
        name: On credit hold, every item is an allowed stock type
        when: { customer.active: true, customer.credit_hold: $hold_state, item.stock_type: { all_in: $allowed_on_credit_hold } }
        then: ALLOW
      - id: small-order
        name: Small order at a known rate
        when: { order.lines: { in: [1, 2, 3] }, customer.rate: "0.5" }
        then: ALLOW
      - id: priced-items
        name: Items priced in whole or half units
        when: { item.unit_price: { any_in: ["1.50", "2"] } }
        then: DENY
      - id: any-order
        name: Any other order
        when: {}
        then: DENY

bindings:
  global: { policy: credit_check }
