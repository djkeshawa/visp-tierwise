id: kind-definition-unknown-member
specVersion: "0.1"
clauses: [KIND-3, KEY-5]
description: "A kind definition with a member that KIND-3 does not allow is E_KIND_DEFINITION at that member."
expect:
  findings:
    - code: E_KIND_DEFINITION
      file: "schema/core.yaml"
      path: [kinds, unused_empty, colour]
      line: 30
