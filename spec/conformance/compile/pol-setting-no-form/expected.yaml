id: pol-setting-no-form
specVersion: "0.1"
clauses: [POL-12]
description: "A setting declaration with neither value_of nor list_of is an invalid setting, reported at the declaration."
expect:
  findings:
    - code: E_INVALID_SETTING
      file: "rules/checkout.order_submission.yaml"
      path: ["policies", "credit_check", "settings", "extra_check"]
      line: 7
