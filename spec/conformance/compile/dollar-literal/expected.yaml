id: dollar-literal
specVersion: "0.1"
clauses: [RULE-4, RULE-5, RULE-22]
description: "A quoted string that begins with a dollar sign is read as a setting reference, so it cannot be a literal and is reported as E_UNKNOWN_SETTING."
expect:
  findings:
    - code: E_UNKNOWN_SETTING
      file: rules/pos.basket_check.yaml
      path: ["policies", "standard", "rules", 2, "when", "shopper.tier"]
      line: 20
