id: "manifest-path-preset-missing"
specVersion: "0.1"
clauses: ["MANIFEST-23","MANIFEST-24","FIND-23","FIND-12"]
description: "A path preset reference that names no file is reported as E_PRESET at its extends item."
expect:
  findings:
    - code: "E_PRESET"
      file: "tierwise.yaml"
      path: ["extends",0]
      line: 3
