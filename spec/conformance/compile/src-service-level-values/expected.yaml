id: "src-service-level-values"
specVersion: "0.1"
clauses: ["SRC-33","SCOPE-47","KEY-11","FIND-12"]
description: "A values file that gives values for a service-sourced level is reported as E_SOURCE_MAPPING at that level."
expect:
  findings:
    - code: "E_SOURCE_MAPPING"
      file: "values/terminal.yaml"
      path: ["terminal"]
      line: 1
