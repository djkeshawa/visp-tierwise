id: hierarchy-entity-graph-belongs-to-cycle
specVersion: "0.1"
clauses: ["ENTITY-14", "ENTITY-17"]
description: "A belongs_to cycle between two entities is E_ENTITY_GRAPH, reported at the entity declared first on the cycle."
expect:
  findings:
    - code: E_ENTITY_GRAPH
      file: "schema/hierarchy.yaml"
      path: ["entity_hierarchy", "alpha"]
      line: 4
