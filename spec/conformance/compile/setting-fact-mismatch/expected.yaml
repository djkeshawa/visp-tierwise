id: setting-fact-mismatch
specVersion: "0.1"
clauses: [RULE-25]
description: "A setting declared for one fact, used on another fact of the same policy, is reported as E_INVALID_SETTING."
expect:
  findings:
    - code: E_INVALID_SETTING
      file: rules/checkout.order_submission.yaml
      path: ["policies", "credit_check", "rules", 1, "when", "item.unit_price"]
      line: 17
