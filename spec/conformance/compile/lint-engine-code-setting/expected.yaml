id: lint-engine-code-setting
specVersion: "0.1"
clauses: [LINT-8]
description: "A manifest lint setting that names an engine error code is E_PRESET at the setting, whatever its value."
expect:
  findings:
    - code: E_PRESET
      file: "tierwise.yaml"
      path: [lint, rules, E_KIND_VIOLATION]
      line: 26
