id: key-settable-unknown-scope
specVersion: "0.1"
clauses: [KEY-6, SCOPE-46]
description: "A settable_at name that is not a declared scope gives E_UNKNOWN_SCOPE at that item of the list (the FIND-21 and FIND-22 line of a flow item)."
expect:
  findings:
    - code: E_UNKNOWN_SCOPE
      file: "schema/keys.yaml"
      path: ["keys", "spare_slots", "settable_at", 1]
      line: 28
