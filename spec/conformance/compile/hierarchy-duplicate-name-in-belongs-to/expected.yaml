id: hierarchy-duplicate-name-in-belongs-to
specVersion: "0.1"
clauses: ["ENTITY-8"]
description: "A name repeated in one belongs_to list is E_DUPLICATE_VALUE at the repeated item."
expect:
  findings:
    - code: E_DUPLICATE_VALUE
      file: "schema/model.yaml"
      path: ["entity_hierarchy", "order", "belongs_to", 2]
      line: 15
