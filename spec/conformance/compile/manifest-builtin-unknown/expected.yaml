id: "manifest-builtin-unknown"
specVersion: "0.1"
clauses: ["MANIFEST-21","MANIFEST-22","FIND-23","FIND-12"]
description: "A built-in preset reference whose name is not built in is reported as E_PRESET at its extends item."
expect:
  findings:
    - code: "E_PRESET"
      file: "tierwise.yaml"
      path: ["extends",0]
      line: 3
