id: lint-naming-invalid-pattern
specVersion: "0.1"
clauses: [LINT-17, LINT-14]
description: "A naming pattern with an unclosed bracket class is E_INVALID_DECLARATION at pattern."
expect:
  findings:
    - code: E_INVALID_DECLARATION
      file: "schema/core.yaml"
      path: [naming, node_id, pattern]
      line: 49
