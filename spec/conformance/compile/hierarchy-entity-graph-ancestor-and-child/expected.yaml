id: hierarchy-entity-graph-ancestor-and-child
specVersion: "0.1"
clauses: ["ENTITY-10", "ENTITY-11", "ENTITY-16", "ENTITY-17"]
description: "An entity that is both an ancestor and a child of another entity is E_ENTITY_GRAPH, reported at the entity declared first on the cycle."
expect:
  findings:
    - code: E_ENTITY_GRAPH
      file: "schema/hierarchy.yaml"
      path: ["entity_hierarchy", "alpha"]
      line: 4
