id: facts/check-order/decide-region-no-binding-root
specVersion: "0.1"
clauses: [EVAL-21, BIND-13, BIND-16, PROV-69]
description: "A context node with no binding does not raise an error, and the root binding is selected."
call: decide
bundle: ../../../bundles/edge-facts.json
context: { levels: { region: north } }
feature: edge.order_gate
input: { facts: { customer.active: true, order.label: water, order.note: x, order.total: "1.5" }, children: { line: [ { line.kind: SINGLE } ] } }
expect:
  effect: ALLOW
  reason: { type: RULE, id: exact-total, name: Total is exactly one and a half }
  policy: gate
  binding: { level: global }
  trace:
    - { id: exact-total, matched: true }
