id: facts/check-order/decide-sync-factset-invalid
specVersion: "0.1"
clauses: [EVAL-9, EVAL-12, EVAL-36, FACT-35]
description: "The synchronous variant of decide raises E_FACTS_INVALID for the same invalid boolean value."
call: decide
sync: true
bundle: ../../../bundles/edge-facts.json
feature: edge.order_gate
input: { facts: { customer.active: "true", order.label: water, order.note: x, order.total: "2" }, children: { line: [ { line.kind: SINGLE } ] } }
expect:
  error: E_FACTS_INVALID
