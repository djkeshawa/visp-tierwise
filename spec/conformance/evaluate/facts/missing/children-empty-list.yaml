id: facts/missing/children-empty-list
specVersion: "0.1"
clauses: [FACT-18, RULE-33]
description: "An empty child list is present, so no child fact is missing, and any_in on it does not hold."
call: decide
bundle: ../../../bundles/edge-facts.json
feature: edge.order_gate
input: { facts: { customer.active: true, order.label: water, order.note: x, order.total: "2" }, children: { line: [] } }
expect:
  effect: DENY
  reason: { type: DEFAULT }
  policy: gate
  trace:
    - { id: exact-total, matched: false, failed: { fact: order.total, op: eq } }
    - { id: label-cafe, matched: false, failed: { fact: order.label, op: eq } }
    - { id: bulk-line-active, matched: false, failed: { fact: line.kind, op: any_in } }
    - { id: note-cafe, matched: false, failed: { fact: order.note, op: eq } }
