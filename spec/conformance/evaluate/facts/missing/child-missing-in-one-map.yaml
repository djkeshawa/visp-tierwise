id: facts/missing/child-missing-in-one-map
specVersion: "0.1"
clauses: [FACT-19, RULE-44]
description: "A child fact absent from one child map of the list is missing, so the reason is MISSING_FACT."
call: decide
bundle: ../../../bundles/edge-facts.json
feature: edge.order_gate
input: { facts: { customer.active: true, order.label: water, order.note: x, order.total: "2" }, children: { line: [ { line.kind: SINGLE }, { } ] } }
expect:
  effect: DENY
  reason: { type: MISSING_FACT, facts: [ line.kind ] }
  policy: gate
  trace: []
