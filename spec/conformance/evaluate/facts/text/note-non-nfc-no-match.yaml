id: facts/text/note-non-nfc-no-match
specVersion: "0.1"
clauses: [NORM-4, NORM-5, NORM-6, FACT-36, RULE-35]
description: "A string fact in decomposed form is valid but is not equal to the NFC literal, so the rule does not hold."
call: decide
bundle: ../../../bundles/edge-facts.json
feature: edge.order_gate
input: { facts: { customer.active: true, order.label: water, order.note: "cafe\u0301", order.total: "2" }, children: { line: [ { line.kind: SINGLE } ] } }
expect:
  effect: DENY
  reason: { type: DEFAULT }
  policy: gate
  trace:
    - { id: exact-total, matched: false, failed: { fact: order.total, op: eq } }
    - { id: label-cafe, matched: false, failed: { fact: order.label, op: eq } }
    - { id: bulk-line-active, matched: false, failed: { fact: line.kind, op: any_in } }
    - { id: note-cafe, matched: false, failed: { fact: order.note, op: eq } }
