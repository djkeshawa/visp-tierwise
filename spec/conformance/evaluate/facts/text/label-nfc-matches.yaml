id: facts/text/label-nfc-matches
specVersion: "0.1"
clauses: [NORM-3, NORM-6, RULE-35]
description: "An enum value in NFC equal to a declared NFC value is accepted, and its rule holds."
call: decide
bundle: ../../../bundles/edge-facts.json
feature: edge.order_gate
input: { facts: { customer.active: true, order.label: "caf\u00e9", order.note: x, order.total: "2" }, children: { line: [ { line.kind: SINGLE } ] } }
expect:
  effect: ALLOW
  reason: { type: RULE, id: label-cafe, name: Label is cafe }
  policy: gate
  trace:
    - { id: exact-total, matched: false, failed: { fact: order.total, op: eq } }
    - { id: label-cafe, matched: true }
