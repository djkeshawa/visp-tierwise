id: facts/text/note-case-differs
specVersion: "0.1"
clauses: [NORM-4, NORM-7, FACT-36]
description: "A string fact that differs from a literal only in case is valid and does not match the condition."
call: decide
bundle: ../../../bundles/edge-facts.json
feature: edge.order_gate
input: { facts: { customer.active: true, order.label: water, order.note: "CAF\u00c9", order.total: "2" }, children: { line: [ { line.kind: SINGLE } ] } }
expect:
  effect: DENY
  reason: { type: DEFAULT }
  policy: gate
  trace:
    - { id: exact-total, matched: false, failed: { fact: order.total, op: eq } }
    - { id: label-cafe, matched: false, failed: { fact: order.label, op: eq } }
    - { id: bulk-line-active, matched: false, failed: { fact: line.kind, op: any_in } }
    - { id: note-cafe, matched: false, failed: { fact: order.note, op: eq } }
