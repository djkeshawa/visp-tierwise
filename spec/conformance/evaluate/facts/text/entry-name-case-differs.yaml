id: facts/text/entry-name-case-differs
specVersion: "0.1"
clauses: [FACT-36, FACT-26, FACT-42]
description: "A FactSet entry name compared as received: Order.total is not the declared order.total, so it raises E_FACTS_INVALID."
call: decide
bundle: ../../../bundles/edge-facts.json
feature: edge.order_gate
input: { facts: { customer.active: true, Order.total: "1.5", order.label: water, order.note: x }, children: { line: [ { line.kind: SINGLE } ] } }
expect:
  error: E_FACTS_INVALID
