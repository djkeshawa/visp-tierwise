id: facts/shape/children-order-reversed-b
specVersion: "0.1"
clauses: [FACT-20, RULE-32]
description: "The same child maps in the reverse order give the same valid result, as the order of child maps does not matter."
call: decide
bundle: ../../../bundles/edge-facts.json
feature: edge.order_gate
input: { facts: { customer.active: true, order.label: water, order.note: x, order.total: "2" }, children: { line: [ { line.kind: BULK }, { line.kind: SINGLE } ] } }
expect:
  effect: ALLOW
  reason: { type: RULE, id: bulk-line-active, name: Active customer with a bulk line }
  policy: gate
  binding: { level: global }
  trace:
    - { id: exact-total, matched: false, failed: { fact: order.total, op: eq } }
    - { id: label-cafe, matched: false, failed: { fact: order.label, op: eq } }
    - { id: bulk-line-active, matched: true }
