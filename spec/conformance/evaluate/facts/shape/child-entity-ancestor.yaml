id: facts/shape/child-entity-ancestor
specVersion: "0.1"
clauses: [FACT-29]
description: "A children entry for an ancestor of the decided entity raises E_FACTS_INVALID, because an ancestor is not a child."
call: decide
bundle: ../../../bundles/edge-facts.json
feature: edge.order_gate
input: { facts: { customer.active: true, order.label: water, order.note: x, order.total: "2" }, children: { customer: [ { customer.active: true } ] } }
expect:
  error: E_FACTS_INVALID
