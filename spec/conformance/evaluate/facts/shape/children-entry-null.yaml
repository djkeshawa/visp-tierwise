id: facts/shape/children-entry-null
specVersion: "0.1"
clauses: [FACT-30, FACT-31]
description: "A null child collection raises E_FACTS_INVALID, not a missing child fact."
call: decide
bundle: ../../../bundles/edge-facts.json
feature: edge.order_gate
input: { facts: { customer.active: true, order.label: water, order.note: x, order.total: "2" }, children: { line: null } }
expect:
  error: E_FACTS_INVALID
