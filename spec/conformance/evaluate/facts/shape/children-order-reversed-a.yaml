id: facts/shape/children-order-reversed-a
specVersion: "0.1"
clauses: [FACT-13, FACT-14, FACT-20, RULE-32]
description: "Child maps in one order give a valid FactSet, and any_in holds when one child is BULK."
call: decide
bundle: ../../../bundles/edge-facts.json
feature: edge.order_gate
input: { facts: { customer.active: true, order.label: water, order.note: x, order.total: "2" }, children: { line: [ { line.kind: SINGLE }, { line.kind: BULK } ] } }
expect:
  effect: ALLOW
  reason: { type: RULE, id: bulk-line-active, name: Active customer with a bulk line }
  policy: gate
  binding: { level: global }
  trace:
    - { id: exact-total, matched: false, failed: { fact: order.total, op: eq } }
    - { id: label-cafe, matched: false, failed: { fact: order.label, op: eq } }
    - { id: bulk-line-active, matched: true }
