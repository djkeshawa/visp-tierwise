id: facts/shape/child-fact-in-facts
specVersion: "0.1"
clauses: [FACT-27]
description: "A child fact placed among the single-value facts raises E_FACTS_INVALID."
call: decide
bundle: ../../../bundles/edge-facts.json
feature: edge.order_gate
input: { facts: { customer.active: true, order.label: water, order.note: x, order.total: "2", line.kind: SINGLE }, children: { line: [ { line.kind: SINGLE } ] } }
expect:
  error: E_FACTS_INVALID
