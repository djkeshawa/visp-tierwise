id: facts/shape/ineligible-sibling-fact
specVersion: "0.1"
clauses: [FACT-27, FACT-15]
description: "A fact of invoice, which names order in has_many without being an ancestor, is not eligible and raises E_FACTS_INVALID."
call: decide
bundle: ../../../bundles/edge-facts.json
feature: edge.order_gate
input: { facts: { customer.active: true, order.label: water, order.note: x, order.total: "2", invoice.status: OPEN }, children: { line: [ { line.kind: SINGLE } ] } }
expect:
  error: E_FACTS_INVALID
