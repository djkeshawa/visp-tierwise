id: facts/shape/extra-member
specVersion: "0.1"
clauses: [FACT-23, EVAL-36, EVAL-23]
description: "A FactSet with a member other than facts and children raises E_FACTS_INVALID and returns no result."
call: decide
bundle: ../../../bundles/edge-facts.json
feature: edge.order_gate
input: { facts: { customer.active: true, order.label: water, order.note: x, order.total: "2" }, children: { line: [ { line.kind: SINGLE } ] }, remarks: x }
expect:
  error: E_FACTS_INVALID
