id: facts/shape/child-map-grandchild-fact
specVersion: "0.1"
clauses: [FACT-33, FACT-15]
description: "A child map that holds a fact of a child of its own child entity raises E_FACTS_INVALID."
call: decide
bundle: ../../../bundles/edge-facts.json
feature: edge.order_gate
input: { facts: { customer.active: true, order.label: water, order.note: x, order.total: "2" }, children: { line: [ { line.kind: SINGLE, part.code: A1 } ] } }
expect:
  error: E_FACTS_INVALID
