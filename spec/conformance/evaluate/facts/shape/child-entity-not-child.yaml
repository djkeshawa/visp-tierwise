id: facts/shape/child-entity-not-child
specVersion: "0.1"
clauses: [FACT-29]
description: "A children entry for an entity that names the decided entity in has_many, but is not its child, raises E_FACTS_INVALID."
call: decide
bundle: ../../../bundles/edge-facts.json
feature: edge.order_gate
input: { facts: { customer.active: true, order.label: water, order.note: x, order.total: "2" }, children: { invoice: [ { invoice.status: OPEN } ] } }
expect:
  error: E_FACTS_INVALID
