id: facts/shape/undeclared-entry-null
specVersion: "0.1"
clauses: [FACT-26, FACT-42, FACT-43]
description: "An undeclared name in facts raises E_FACTS_INVALID even when its value is null."
call: decide
bundle: ../../../bundles/edge-facts.json
feature: edge.order_gate
input: { facts: { customer.active: true, order.label: water, order.note: x, order.total: "2", order.nickname: null }, children: { line: [ { line.kind: SINGLE } ] } }
expect:
  error: E_FACTS_INVALID
