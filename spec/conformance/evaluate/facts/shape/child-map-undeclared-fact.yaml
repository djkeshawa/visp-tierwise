id: facts/shape/child-map-undeclared-fact
specVersion: "0.1"
clauses: [FACT-33]
description: "A child map that holds an undeclared name raises E_FACTS_INVALID, whatever its value."
call: decide
bundle: ../../../bundles/edge-facts.json
feature: edge.order_gate
input: { facts: { customer.active: true, order.label: water, order.note: x, order.total: "2" }, children: { line: [ { line.kind: SINGLE, line.weight: 3 } ] } }
expect:
  error: E_FACTS_INVALID
