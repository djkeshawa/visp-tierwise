id: facts/decimal/child-canonical-any
specVersion: "0.1"
clauses: [RULE-16, NORM-15, RULE-32]
description: "A child decimal \"2.50\" is canonicalised to \"2.5\" before any_in compares it with the literal."
call: decide
bundle: ../../../bundles/edge-facts.json
feature: edge.decimal_probe
input: { facts: { order.total: "9" }, children: { line: [ { line.amount: "2.50" } ] } }
expect:
  effect: HIT
  reason: { type: RULE, id: line-amount-probe, name: A line amount is 2.5 }
  policy: probe
  trace:
    - { id: total-in-set, matched: false, failed: { fact: order.total, op: in } }
    - { id: line-amount-probe, matched: true }
