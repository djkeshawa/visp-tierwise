id: facts/values/integer-non-integral
specVersion: "0.1"
clauses: [FACT-35, TYPE-17]
description: "A non-integral number given for an integer fact raises E_FACTS_INVALID."
call: decide
bundle: ../../../bundles/edge-facts.json
feature: edge.order_gate
input: { facts: { customer.active: true, order.label: water, order.note: x, order.total: "2", order.lines: 1.5 }, children: { line: [ { line.kind: SINGLE } ] } }
expect:
  error: E_FACTS_INVALID
