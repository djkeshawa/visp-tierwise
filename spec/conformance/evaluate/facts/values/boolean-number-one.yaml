id: facts/values/boolean-number-one
specVersion: "0.1"
clauses: [FACT-35, TYPE-12, NORM-17]
description: "A boolean fact given the number 1 raises E_FACTS_INVALID, because 1 is not a boolean value."
call: decide
bundle: ../../../bundles/edge-facts.json
feature: edge.order_gate
input: { facts: { customer.active: 1, order.label: water, order.note: x, order.total: "2" }, children: { line: [ { line.kind: SINGLE } ] } }
expect:
  error: E_FACTS_INVALID
