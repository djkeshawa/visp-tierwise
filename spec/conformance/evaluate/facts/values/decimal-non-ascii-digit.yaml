id: facts/values/decimal-non-ascii-digit
specVersion: "0.1"
clauses: [FACT-40, TYPE-24]
description: "A decimal string with a fullwidth digit (U+FF11) does not match the ASCII digit syntax and raises E_FACTS_INVALID."
call: decide
bundle: ../../../bundles/edge-facts.json
feature: edge.order_gate
input: { facts: { customer.active: true, order.label: water, order.note: x, order.total: "１" }, children: { line: [ { line.kind: SINGLE } ] } }
expect:
  error: E_FACTS_INVALID
