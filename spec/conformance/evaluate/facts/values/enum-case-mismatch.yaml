id: facts/values/enum-case-mismatch
specVersion: "0.1"
clauses: [FACT-37, NORM-7]
description: "An enum value that differs only in case from a declared value raises E_FACTS_INVALID."
call: decide
bundle: ../../../bundles/edge-facts.json
feature: edge.order_gate
input: { facts: { customer.active: true, order.label: Tea, order.note: x, order.total: "2" }, children: { line: [ { line.kind: SINGLE } ] } }
expect:
  error: E_FACTS_INVALID
