id: facts/values/decimal-trailing-dot
specVersion: "0.1"
clauses: [FACT-40, TYPE-24]
description: "A decimal string with no fraction digits (\"1.\") does not match the runtime syntax and raises E_FACTS_INVALID."
call: decide
bundle: ../../../bundles/edge-facts.json
feature: edge.order_gate
input: { facts: { customer.active: true, order.label: water, order.note: x, order.total: "1." }, children: { line: [ { line.kind: SINGLE } ] } }
expect:
  error: E_FACTS_INVALID
