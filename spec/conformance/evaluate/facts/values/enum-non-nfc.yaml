id: facts/values/enum-non-nfc
specVersion: "0.1"
clauses: [FACT-37, NORM-5, NORM-6]
description: "An enum value in decomposed form is not equal to the NFC declared value, so it raises E_FACTS_INVALID."
call: decide
bundle: ../../../bundles/edge-facts.json
feature: edge.order_gate
input: { facts: { customer.active: true, order.label: "cafe\u0301", order.note: x, order.total: "2" }, children: { line: [ { line.kind: SINGLE } ] } }
expect:
  error: E_FACTS_INVALID
