id: facts/values/decimal-number-integer
specVersion: "0.1"
clauses: [FACT-38, TYPE-25]
description: "An integer number given for a decimal fact raises E_FACTS_INVALID, because a number is never a decimal value."
call: decide
bundle: ../../../bundles/edge-facts.json
feature: edge.order_gate
input: { facts: { customer.active: true, order.label: water, order.note: x, order.total: 2 }, children: { line: [ { line.kind: SINGLE } ] } }
expect:
  error: E_FACTS_INVALID
