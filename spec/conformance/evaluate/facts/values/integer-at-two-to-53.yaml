id: facts/values/integer-at-two-to-53
specVersion: "0.1"
clauses: [FACT-41, TYPE-18]
description: "An integer fact equal to 2^53 is outside the range of integer values and raises E_FACTS_INVALID."
call: decide
bundle: ../../../bundles/edge-facts.json
feature: edge.order_gate
input: { facts: { customer.active: true, order.label: water, order.note: x, order.total: "2", order.units: 9007199254740992 }, children: { line: [ { line.kind: SINGLE } ] } }
expect:
  error: E_FACTS_INVALID
