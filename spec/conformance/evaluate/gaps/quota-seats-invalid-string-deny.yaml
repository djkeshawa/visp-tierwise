id: gaps/quota-seats-invalid-string-deny
specVersion: "0.1"
clauses: [TYPE-75, TYPE-70, SVC-31, SVC-34, SVC-9, MERGE-15, PROV-40, PROV-41, EVAL-7]
description: A string given for an integer key is INVALID under deny, and the level contributes the deny value, the min member of the declaration.
call: resolve
bundle: ../../bundles/edge-gaps.json
context: { levels: { account: acct-1 } }
key: quota.seats
providers:
  account:
    acct-1:
      values: { quota.seats: "many" }
expect:
  value: 1
  contributions:
    - { scope: level, name: account, node: acct-1, value: 1, effect: INVALID, onSourceFailure: deny }
  providerCalls: { account: { acct-1: 1 } }
