id: providers/formats-values
specVersion: "0.1"
clauses: [EVAL-7, SVC-19, SVC-31, MERGE-17, PROV-20, PROV-38]
description: A non-empty tenant set under union is a WIDENED entry, and the result is that set in universe order.
call: resolve
bundle: ../../bundles/edge-providers.json
context: { levels: { tenant: t-1 } }
key: export.formats
providers:
  tenant:
    t-1:
      values: { export.formats: [pdf] }
expect:
  value: [pdf]
  contributions:
    - { scope: level, name: tenant, node: t-1, value: [pdf], effect: WIDENED }
  providerCalls: { tenant: { t-1: 1 } }
