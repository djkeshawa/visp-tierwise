id: providers/sync-unknown-key-first
specVersion: "0.1"
clauses: [EVAL-11, EVAL-16, EVAL-18, EVAL-20, EVAL-34, SVC-42]
description: A synchronous resolve with an undeclared key raises E_UNKNOWN_KEY at the lookup step, before the provider need is checked.
call: resolve
sync: true
bundle: ../../bundles/edge-providers.json
context: { levels: { tenant: t-1 } }
key: no.such.key
providers:
  tenant:
    t-1:
      values: {}
expect:
  error: E_UNKNOWN_KEY
  providerCalls: { tenant: { t-1: 0 } }
