id: providers/access-values-false
specVersion: "0.1"
clauses: [EVAL-7, SVC-19, SVC-31, PROV-20, PROV-38, MERGE-17]
description: A valid false from the tenant provider under deny is a VETO value entry that makes the all result false.
call: resolve
bundle: ../../bundles/edge-providers.json
context: { levels: { tenant: t-1 } }
key: access.allowed
providers:
  tenant:
    t-1:
      values: { access.allowed: false }
expect:
  value: false
  contributions:
    - { scope: level, name: tenant, node: t-1, value: false, effect: VETO }
  providerCalls: { tenant: { t-1: 1 } }
