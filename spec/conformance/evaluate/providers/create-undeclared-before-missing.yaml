id: providers/create-undeclared-before-missing
specVersion: "0.1"
clauses: [EVAL-15, EVAL-26, EVAL-27, SVC-14]
description: E_EVALUATOR_OPTIONS for an undeclared level takes precedence over E_PROVIDER_MISSING for a service level with no provider.
call: resolve
bundle: ../../bundles/edge-providers.json
context: { levels: { tenant: t-1 } }
key: access.allowed
providers:
  campus:
    c-1:
      values: {}
  seat: none
expect:
  error: E_EVALUATOR_OPTIONS
