id: providers/quota-values-with-region
specVersion: "0.1"
clauses: [EVAL-7, SVC-19, SVC-31, MERGE-17, PROV-20, PROV-38]
description: Under min, a valid tenant value narrows the region value, and both scopes contribute NARROWED entries in path order.
call: resolve
bundle: ../../bundles/edge-providers.json
context: { levels: { region: east, tenant: t-1 } }
key: quota.max_items
providers:
  tenant:
    t-1:
      values: { quota.max_items: 4 }
expect:
  value: 4
  contributions:
    - { scope: level, name: region, node: east, value: 6, effect: NARROWED }
    - { scope: level, name: tenant, node: t-1, value: 4, effect: NARROWED }
  providerCalls: { tenant: { t-1: 1 } }
