id: providers/create-provider-undeclared-level
specVersion: "0.1"
clauses: [EVAL-4, EVAL-15, EVAL-27, SVC-14]
description: A provider registered for a level that the bundle does not declare makes create evaluator raise E_EVALUATOR_OPTIONS.
call: resolve
bundle: ../../bundles/edge-providers.json
context: { levels: { tenant: t-1 } }
key: access.allowed
providers:
  tenant:
    t-1:
      values: {}
  campus:
    c-1:
      values: {}
expect:
  error: E_EVALUATOR_OPTIONS
