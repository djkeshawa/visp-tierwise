id: providers/access-unavailable
specVersion: "0.1"
clauses: [EVAL-7, EVAL-39, SVC-9, SVC-10, SVC-23, SVC-24, PROV-8, PROV-29, PROV-32, PROV-41]
description: An unavailable tenant provider under deny contributes the deny value false as an UNAVAILABLE failure entry and raises no error.
call: resolve
bundle: ../../bundles/edge-providers.json
context: { levels: { tenant: t-1 } }
key: access.allowed
providers:
  tenant:
    t-1:
      fail: unavailable
expect:
  value: false
  contributions:
    - { scope: level, name: tenant, node: t-1, value: false, effect: UNAVAILABLE, onSourceFailure: deny }
  providerCalls: { tenant: { t-1: 1 } }
