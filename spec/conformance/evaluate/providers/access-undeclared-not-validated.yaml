id: providers/access-undeclared-not-validated
specVersion: "0.1"
clauses: [EVAL-7, SVC-28, PROV-42]
description: Declared keys that the call does not resolve are not validated, so an invalid or null entry for one of them does not affect the resolved key.
call: resolve
bundle: ../../bundles/edge-providers.json
context: { levels: { tenant: t-1 } }
key: access.allowed
providers:
  tenant:
    t-1:
      values: { quota.max_items: "not-an-integer", shipping.methods: null }
expect:
  value: true
  contributions: []
  providerCalls: { tenant: { t-1: 1 } }
