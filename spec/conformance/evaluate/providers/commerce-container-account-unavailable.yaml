id: providers/commerce-container-account-unavailable
specVersion: "0.1"
clauses: [EVAL-7, SVC-9, SVC-23, SVC-24, MERGE-15, PROV-29, PROV-41]
description: On sample domain A, an unavailable account provider under deny makes checkout.container_order.allowed false.
call: resolve
bundle: ../../bundles/commerce.json
context: { levels: { division: south, account: acct-17 } }
key: checkout.container_order.allowed
providers:
  account:
    acct-17:
      fail: unavailable
expect:
  value: false
  contributions:
    - { scope: level, name: account, node: acct-17, value: false, effect: UNAVAILABLE, onSourceFailure: deny }
  providerCalls: { account: { acct-17: 1 } }
