id: providers/sync-context-error-first
specVersion: "0.1"
clauses: [EVAL-11, EVAL-16, EVAL-18, EVAL-20, EVAL-33, CTX-9, CTX-10, CTX-12, SVC-17, SVC-42]
description: A synchronous resolve with an unlisted node in a closed catalog raises E_UNKNOWN_NODE during context validation, before the provider need is checked.
call: resolve
sync: true
bundle: ../../bundles/edge-providers.json
context: { levels: { region: north, tenant: t-1 } }
key: access.allowed
providers:
  tenant:
    t-1:
      values: { access.allowed: false }
expect:
  error: E_UNKNOWN_NODE
  providerCalls: { tenant: { t-1: 0 } }
