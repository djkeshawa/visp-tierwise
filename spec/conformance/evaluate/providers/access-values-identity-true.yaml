id: providers/access-values-identity-true
specVersion: "0.1"
clauses: [EVAL-7, SVC-19, SVC-31, SVC-33, PROV-21, PROV-38, MERGE-17]
description: A valid true from the tenant provider is the identity of all, so it is a value entry labelled IGNORED and the result stays true.
call: resolve
bundle: ../../bundles/edge-providers.json
context: { levels: { tenant: t-1 } }
key: access.allowed
providers:
  tenant:
    t-1:
      values: { access.allowed: true }
expect:
  value: true
  contributions:
    - { scope: level, name: tenant, node: t-1, value: true, effect: IGNORED }
  providerCalls: { tenant: { t-1: 1 } }
