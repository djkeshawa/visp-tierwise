id: providers/saas-max-seats-user-unavailable
specVersion: "0.1"
clauses: [EVAL-7, SVC-9, SVC-23, SVC-24, MERGE-15, MERGE-17, PROV-29, PROV-38, PROV-41]
description: On the docs-only saas-entitlements sample, a deny value at the integer minimum 0 makes the min result 0, below the plan and org values.
call: resolve
bundle: ../../bundles/saas-entitlements.json
context: { levels: { org: acme, user: u-1 } }
key: usage.max_seats
providers:
  user:
    u-1:
      fail: unavailable
expect:
  value: 0
  contributions:
    - { scope: level, name: plan, value: 25, effect: NARROWED }
    - { scope: level, name: org, node: acme, value: 10, effect: NARROWED }
    - { scope: level, name: user, node: u-1, value: 0, effect: UNAVAILABLE, onSourceFailure: deny }
  providerCalls: { user: { u-1: 1 } }
