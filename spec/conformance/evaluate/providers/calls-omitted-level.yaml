id: providers/calls-omitted-level
specVersion: "0.1"
clauses: [EVAL-7, CTX-21, SVC-13, SVC-17]
description: A settable service level that the context omits is not called, so its provider entries have no effect.
call: resolve
bundle: ../../bundles/edge-providers.json
context: { levels: { tenant: t-1 } }
key: access.allowed
providers:
  tenant:
    t-1:
      values: {}
  partner:
    p-1:
      values: { access.allowed: false }
expect:
  value: true
  contributions: []
  providerCalls: { tenant: { t-1: 1 }, partner: { p-1: 0 } }
