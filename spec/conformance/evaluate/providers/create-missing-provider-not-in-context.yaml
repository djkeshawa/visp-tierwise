id: providers/create-missing-provider-not-in-context
specVersion: "0.1"
clauses: [EVAL-4, EVAL-26, SVC-14]
description: A missing provider for a service-sourced level that the context does not name still makes create evaluator raise E_PROVIDER_MISSING.
call: resolve
bundle: ../../bundles/edge-providers.json
context: { levels: { region: east } }
key: quota.max_items
providers:
  tenant: none
expect:
  error: E_PROVIDER_MISSING
