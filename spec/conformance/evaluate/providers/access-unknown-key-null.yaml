id: providers/access-unknown-key-null
specVersion: "0.1"
clauses: [EVAL-7, EVAL-40, SVC-26, SVC-27, PROV-42]
description: A provider entry for an undeclared key is ignored whatever its value, including null, and is not a source failure.
call: resolve
bundle: ../../bundles/edge-providers.json
context: { levels: { tenant: t-1 } }
key: access.allowed
providers:
  tenant:
    t-1:
      values: { no.such.key: null }
expect:
  value: true
  contributions: []
  providerCalls: { tenant: { t-1: 1 } }
