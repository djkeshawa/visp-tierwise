id: merge/deep-unset-default
specVersion: "0.1"
clauses: [MERGE-9, MERGE-10, MERGE-25, PROV-7, PROV-10, PROV-16, PROV-45, PROV-48, PROV-53, PROV-1, PROV-4, PROV-5, PROV-11, PROV-12, PROV-13, PROV-14]
description: With no scope setting merge.window, a deep_merge key takes its complete default object and its source is DEFAULT.
call: resolve
bundle: ../../bundles/edge-merge.json
key: merge.window
exact: true
expect:
  key: merge.window
  strategy: deep_merge
  value:
    closed_days: [SUN]
    hours: { close: "18:00", open: "08:00" }
    label: standard
  bundleVersion: "sha256:49c9633623285fdf3ac2385eedda4327e7975811d3e3f0f1ce69625a737b90c8"
  skippedScopes: []
  contributions: []
  source: DEFAULT
