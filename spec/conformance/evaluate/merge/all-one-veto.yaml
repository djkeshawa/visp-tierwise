id: merge/all-one-veto
specVersion: "0.1"
clauses: [MERGE-14, MERGE-17, PROV-20, PROV-37, PROV-38, PROV-45]
description: A single false value from one division is the only contribution to the all key, is labelled VETO, and makes the result false.
call: resolve
bundle: ../../bundles/edge-merge.json
context: { levels: { division: south } }
key: merge.all_flag
exact: true
expect:
  key: merge.all_flag
  strategy: all
  value: false
  bundleVersion: "sha256:49c9633623285fdf3ac2385eedda4327e7975811d3e3f0f1ce69625a737b90c8"
  skippedScopes: []
  contributions:
    - { scope: level, name: division, node: south, value: false, effect: VETO }
