id: merge/override-object-replaces-whole
specVersion: "0.1"
clauses: [MERGE-19, MERGE-21, PROV-16, PROV-28, PROV-38, PROV-46, PROV-47, PROV-50, PROV-52, PROV-1, PROV-4, PROV-5, PROV-11, PROV-12, PROV-13, PROV-14]
description: A site object without the optional phone replaces the division object as a whole, so the phone is absent from the result.
call: resolve
bundle: ../../bundles/edge-merge.json
context: { levels: { division: north, site: s1 } }
key: merge.contact
exact: true
expect:
  key: merge.contact
  strategy: override
  value: { name: site-desk }
  bundleVersion: "sha256:49c9633623285fdf3ac2385eedda4327e7975811d3e3f0f1ce69625a737b90c8"
  skippedScopes: []
  contributions:
    - { scope: level, name: division, node: north, value: { name: north-desk, phone: "555-0100" }, effect: SET }
    - { scope: level, name: site, node: s1, value: { name: site-desk }, effect: SET }
  source: { scope: level, name: site, node: s1 }
