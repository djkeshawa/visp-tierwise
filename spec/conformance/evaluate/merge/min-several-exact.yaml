id: merge/min-several-exact
specVersion: "0.1"
clauses: [MERGE-2, MERGE-13, MERGE-14, MERGE-16, MERGE-17, CTX-19, PROV-10, PROV-18, PROV-34, PROV-38, PROV-45, PROV-1, PROV-4, PROV-5, PROV-11, PROV-12, PROV-13, PROV-14]
description: Integers from a division, a site and an account all narrow the min key, so the smallest one is the result.
call: resolve
bundle: ../../bundles/edge-merge.json
context: { levels: { division: north, site: s1, account: acct-1 } }
key: merge.floor
providers:
  account:
    acct-1:
      values: { merge.floor: 60 }
exact: true
expect:
  key: merge.floor
  strategy: min
  value: 40
  bundleVersion: "sha256:49c9633623285fdf3ac2385eedda4327e7975811d3e3f0f1ce69625a737b90c8"
  skippedScopes: []
  contributions:
    - { scope: level, name: division, node: north, value: 100, effect: NARROWED }
    - { scope: level, name: site, node: s1, value: 40, effect: NARROWED }
    - { scope: level, name: account, node: acct-1, value: 60, effect: NARROWED }
  providerCalls: { account: { acct-1: 1 } }
