id: merge/override-several-exact
specVersion: "0.1"
clauses: [MERGE-13, MERGE-16, MERGE-19, CTX-19, PROV-10, PROV-28, PROV-34, PROV-38, PROV-46, PROV-47, PROV-50, PROV-52, PROV-1, PROV-4, PROV-5, PROV-11, PROV-12, PROV-13, PROV-14]
description: Values at a division, a site and an account are all SET, and the most specific level, the account, is the source.
call: resolve
bundle: ../../bundles/edge-merge.json
context: { levels: { division: north, site: s1, account: acct-1 } }
key: merge.label
providers:
  account:
    acct-1:
      values: { merge.label: account-label }
exact: true
expect:
  key: merge.label
  strategy: override
  value: account-label
  bundleVersion: "sha256:49c9633623285fdf3ac2385eedda4327e7975811d3e3f0f1ce69625a737b90c8"
  skippedScopes: []
  contributions:
    - { scope: level, name: division, node: north, value: north-label, effect: SET }
    - { scope: level, name: site, node: s1, value: standard, effect: SET }
    - { scope: level, name: account, node: acct-1, value: account-label, effect: SET }
  source: { scope: level, name: account, node: acct-1 }
  providerCalls: { account: { acct-1: 1 } }
