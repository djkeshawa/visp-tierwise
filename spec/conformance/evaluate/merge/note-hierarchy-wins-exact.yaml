id: merge/note-hierarchy-wins-exact
specVersion: "0.1"
clauses: [AXIS-7, MERGE-19, MERGE-20, MERGE-25, CTX-19, PROV-10, PROV-34, PROV-38, PROV-46, PROV-47, PROV-50, PROV-52, PROV-1, PROV-4, PROV-5, PROV-11, PROV-12, PROV-13, PROV-14]
description: Under hierarchy_wins the division value beats both axis values, and the division is the source.
call: resolve
bundle: ../../bundles/edge-merge.json
context:
  levels: { division: north }
  axes: { seller: acme, promo: spring }
key: merge.note
exact: true
expect:
  key: merge.note
  strategy: override
  value: division-note
  bundleVersion: "sha256:49c9633623285fdf3ac2385eedda4327e7975811d3e3f0f1ce69625a737b90c8"
  skippedScopes: []
  contributions:
    - { scope: level, name: division, node: north, value: division-note, effect: SET }
    - { scope: axis, name: seller, node: acme, value: seller-note, effect: SET }
    - { scope: axis, name: promo, node: spring, value: promo-note, effect: SET }
  source: { scope: level, name: division, node: north }
