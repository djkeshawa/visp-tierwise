id: merge/override-null-invalid-skip
specVersion: "0.1"
clauses: [MERGE-15, MERGE-19, PROV-30, PROV-32, PROV-40, PROV-46, PROV-47, PROV-50, PROV-52, SVC-8, SVC-34, SVC-35, TYPE-76, PROV-1, PROV-4, PROV-5, PROV-11, PROV-12, PROV-13, PROV-14, PROV-31]
description: A null from the account provider is INVALID and adds nothing under skip, so the division value stays the result.
call: resolve
bundle: ../../bundles/edge-merge.json
context: { levels: { division: north, account: acct-3 } }
key: merge.label
providers:
  account:
    acct-3:
      values: { merge.label: null }
exact: true
expect:
  key: merge.label
  strategy: override
  value: north-label
  bundleVersion: "sha256:49c9633623285fdf3ac2385eedda4327e7975811d3e3f0f1ce69625a737b90c8"
  skippedScopes: []
  contributions:
    - { scope: level, name: division, node: north, value: north-label, effect: SET }
    - { scope: level, name: account, node: acct-3, effect: INVALID, onSourceFailure: skip }
  source: { scope: level, name: division, node: north }
  providerCalls: { account: { acct-3: 1 } }
