id: merge/deep-one-partial-nested
specVersion: "0.1"
clauses: [MERGE-9, MERGE-10, MERGE-11, MERGE-12, MERGE-22, MERGE-23, MERGE-25, PROV-28, PROV-46, PROV-47, PROV-53, PROV-1, PROV-4, PROV-5, PROV-11, PROV-12, PROV-13, PROV-14]
description: A division value that sets only the nested close time is stored as a partial object, and the default fills every other field.
call: resolve
bundle: ../../bundles/edge-merge.json
context: { levels: { division: north } }
key: merge.window
exact: true
expect:
  key: merge.window
  strategy: deep_merge
  value:
    closed_days: [SUN]
    hours: { close: "15:00", open: "08:00" }
    label: standard
  bundleVersion: "sha256:49c9633623285fdf3ac2385eedda4327e7975811d3e3f0f1ce69625a737b90c8"
  skippedScopes: []
  contributions:
    - { scope: level, name: division, node: north, value: { hours: { close: "15:00" } }, effect: SET }
  source: { scope: level, name: division, node: north }
