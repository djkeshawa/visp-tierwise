id: merge/deep-invalid-optional-object
specVersion: "0.1"
clauses: [MERGE-12, MERGE-26, PROV-30, PROV-32, PROV-40, PROV-48, SVC-8, SVC-31, SVC-34, PROV-1, PROV-4, PROV-5, PROV-11, PROV-12, PROV-13, PROV-14]
description: An account value that sets only part of the optional exception object, which the default does not set, is INVALID and adds nothing under skip.
call: resolve
bundle: ../../bundles/edge-merge.json
context: { levels: { account: acct-3 } }
key: merge.window
providers:
  account:
    acct-3:
      values:
        merge.window: { exception: { from: "12:00" } }
exact: true
expect:
  key: merge.window
  strategy: deep_merge
  value:
    closed_days: [SUN]
    hours: { close: "18:00", open: "08:00" }
    label: standard
  bundleVersion: "sha256:49c9633623285fdf3ac2385eedda4327e7975811d3e3f0f1ce69625a737b90c8"
  skippedScopes: []
  contributions:
    - { scope: level, name: account, node: acct-3, effect: INVALID, onSourceFailure: skip }
  source: DEFAULT
  providerCalls: { account: { acct-3: 1 } }
