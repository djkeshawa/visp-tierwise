id: merge/any-several-exact
specVersion: "0.1"
clauses: [MERGE-1, MERGE-13, MERGE-14, MERGE-16, MERGE-17, AXIS-2, CTX-19, PROV-10, PROV-18, PROV-20, PROV-21, PROV-34, PROV-37, PROV-38, PROV-45, PROV-1, PROV-4, PROV-5, PROV-11, PROV-12, PROV-13, PROV-14]
description: An identity false from a division is IGNORED, while a true from an account and a true from a seller axis are WIDENED, so the result is true.
call: resolve
bundle: ../../bundles/edge-merge.json
context:
  levels: { division: north, account: acct-1 }
  axes: { seller: acme }
key: merge.any_flag
providers:
  account:
    acct-1:
      values: { merge.any_flag: true }
exact: true
expect:
  key: merge.any_flag
  strategy: any
  value: true
  bundleVersion: "sha256:49c9633623285fdf3ac2385eedda4327e7975811d3e3f0f1ce69625a737b90c8"
  skippedScopes: []
  contributions:
    - { scope: level, name: division, node: north, value: false, effect: IGNORED }
    - { scope: level, name: account, node: acct-1, value: true, effect: WIDENED }
    - { scope: axis, name: seller, node: acme, value: true, effect: WIDENED }
  providerCalls: { account: { acct-1: 1 } }
