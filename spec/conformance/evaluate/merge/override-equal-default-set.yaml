id: merge/override-equal-default-set
specVersion: "0.1"
clauses: [MERGE-19, MERGE-25, PROV-38, PROV-46, PROV-47, PROV-48, PROV-50, PROV-52, PROV-1, PROV-4, PROV-5, PROV-11, PROV-12, PROV-13, PROV-14]
description: A site value equal to the default is still labelled SET, and the site is the source, not DEFAULT.
call: resolve
bundle: ../../bundles/edge-merge.json
context: { levels: { site: s1 } }
key: merge.label
exact: true
expect:
  key: merge.label
  strategy: override
  value: standard
  bundleVersion: "sha256:49c9633623285fdf3ac2385eedda4327e7975811d3e3f0f1ce69625a737b90c8"
  skippedScopes: []
  contributions:
    - { scope: level, name: site, node: s1, value: standard, effect: SET }
  source: { scope: level, name: site, node: s1 }
