id: merge/max-several-exact
specVersion: "0.1"
clauses: [AXIS-2, MERGE-13, MERGE-14, MERGE-16, MERGE-17, CTX-19, PROV-10, PROV-18, PROV-34, PROV-38, PROV-45, PROV-1, PROV-4, PROV-5, PROV-11, PROV-12, PROV-13, PROV-14]
description: Integers from a division, a site, an account and a seller axis all widen the max key, so the largest one is the result.
call: resolve
bundle: ../../bundles/edge-merge.json
context:
  levels: { division: north, site: s1, account: acct-1 }
  axes: { seller: acme }
key: merge.ceiling
providers:
  account:
    acct-1:
      values: { merge.ceiling: 50 }
exact: true
expect:
  key: merge.ceiling
  strategy: max
  value: 90
  bundleVersion: "sha256:49c9633623285fdf3ac2385eedda4327e7975811d3e3f0f1ce69625a737b90c8"
  skippedScopes: []
  contributions:
    - { scope: level, name: division, node: north, value: 30, effect: WIDENED }
    - { scope: level, name: site, node: s1, value: 80, effect: WIDENED }
    - { scope: level, name: account, node: acct-1, value: 50, effect: WIDENED }
    - { scope: axis, name: seller, node: acme, value: 90, effect: WIDENED }
  providerCalls: { account: { acct-1: 1 } }
