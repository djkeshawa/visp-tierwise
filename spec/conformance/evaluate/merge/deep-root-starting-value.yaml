id: merge/deep-root-starting-value
specVersion: "0.1"
clauses: [MERGE-10, MERGE-14, MERGE-23, PROV-25, PROV-34, PROV-46, PROV-47, PROV-53, PROV-1, PROV-4, PROV-5, PROV-11, PROV-12, PROV-13, PROV-14]
description: A deep_merge key with no default takes its complete root value as the starting value, and the root level is the source with no node.
call: resolve
bundle: ../../bundles/edge-merge.json
key: merge.window_no_default
exact: true
expect:
  key: merge.window_no_default
  strategy: deep_merge
  value:
    closed_days: [SAT, SUN]
    hours: { close: "17:00", open: "09:00" }
    label: root
  bundleVersion: "sha256:49c9633623285fdf3ac2385eedda4327e7975811d3e3f0f1ce69625a737b90c8"
  skippedScopes: []
  contributions:
    - { scope: level, name: global, value: { closed_days: [SAT, SUN], hours: { close: "17:00", open: "09:00" }, label: root }, effect: SET }
  source: { scope: level, name: global }
