id: decide/hit-policy/first-failure-code-point-first
specVersion: "0.1"
clauses: [RULE-8, RULE-7, RULE-29, RULE-31, RULE-50, RULE-51, RULE-52, RULE-54, RULE-55, PROV-62, PROV-81, PROV-75, PROV-78, PROV-80, PROV-82, PROV-18, PROV-64, PROV-65, PROV-68, PROV-69, PROV-71, PROV-73, BIND-17, PROV-7, RULE-53, PROV-79]
description: "When two conditions of a rule fail, the failed fact is the one that comes first in code point order of fact name, here account.active, not line.kind."
call: decide
bundle: ../../../bundles/edge-decide.json
context: {}
feature: edge.first_failure
input:
