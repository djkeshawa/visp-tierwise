  effect: DENY
  bundleVersion: "sha256:27903b3197b5a3efc2948383605beafac375ed4f434e54ca8fd35c0ae867e1a1"
  skippedScopes: []
  binding: { level: global }
  policy: main
  reason: { type: DEFAULT }
  trace:
    - { id: three-conditions, matched: false, failed: { fact: account.active, op: eq } }
    - { id: status-closed, matched: false, failed: { fact: order.status, op: eq } }
