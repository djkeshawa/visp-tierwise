id: decide/hit-policy/first-failure-next-rule-checked
specVersion: "0.1"
clauses: [RULE-8, RULE-47, RULE-48, RULE-49, RULE-53, RULE-54, RULE-55, PROV-74, PROV-78, PROV-80, PROV-82, PROV-83, PROV-62, PROV-18, PROV-64, PROV-65, PROV-68, PROV-69, PROV-71, PROV-73, BIND-17, PROV-7, RULE-52, PROV-79, RULE-29, PROV-81]
description: "A failing rule is traced with its first failing condition and the next rule is checked and wins, so the trace lists both."
call: decide
bundle: ../../../bundles/edge-decide.json
context: {}
feature: edge.first_failure
input:
  facts: { account.active: true, order.status: CLOSED }
  children:
    line:
      - { line.kind: GIFT }
exact: true
expect:
  feature: edge.first_failure
  effect: HOLD
  bundleVersion: "sha256:27903b3197b5a3efc2948383605beafac375ed4f434e54ca8fd35c0ae867e1a1"
  skippedScopes: []
  binding: { level: global }
  policy: main
  reason: { type: RULE, id: status-closed, name: "Order is closed" }
  trace:
    - { id: three-conditions, matched: false, failed: { fact: order.status, op: eq } }
    - { id: status-closed, matched: true }
