  effect: ALLOW
  bundleVersion: "sha256:27903b3197b5a3efc2948383605beafac375ed4f434e54ca8fd35c0ae867e1a1"
  skippedScopes: []
  binding: { level: global }
  policy: main
  reason: { type: RULE, id: always, name: "Always" }
  trace:
    - { id: closed-or-held, matched: false, failed: { fact: order.status, op: in } }
    - { id: held-only, matched: false, failed: { fact: order.status, op: eq } }
    - { id: always, matched: true }
