id: decide/hit-policy/first-hit-empty-when-matches
specVersion: "0.1"
clauses: [RULE-2, RULE-46, RULE-47, RULE-48, RULE-49, RULE-52, RULE-53, RULE-54, RULE-55, PROV-74, PROV-78, PROV-82, PROV-83, PROV-62, PROV-18, PROV-64, PROV-65, PROV-68, PROV-69, PROV-71, PROV-73, BIND-17, PROV-7, PROV-79, PROV-80, RULE-30, PROV-81, RULE-29]
description: "A rule whose when mapping is empty always matches, so it is the winner when every earlier rule fails, and each earlier failure is traced."
call: decide
bundle: ../../../bundles/edge-decide.json
context: {}
feature: edge.first_hit
input:
  facts: { order.status: OPEN }
exact: true
expect:
