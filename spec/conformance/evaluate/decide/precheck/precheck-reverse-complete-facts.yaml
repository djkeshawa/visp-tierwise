id: decide/precheck/precheck-reverse-complete-facts
specVersion: "0.1"
clauses: [RULE-45, RULE-46, RULE-47, RULE-48, RULE-49, RULE-39, PROV-62, PROV-74, PROV-78, PROV-82, PROV-83, PROV-18, PROV-64, PROV-65, PROV-68, PROV-69, PROV-71, PROV-73, BIND-17, PROV-7, RULE-52, RULE-53, PROV-79, PROV-80]
description: "With the same facts and the gift rule first, the reverse order gives RELEASE, so rule order decides the winner only once the precheck has passed."
call: decide
bundle: ../../../bundles/edge-decide.json
context: {}
feature: edge.precheck_reverse
input:
  facts: { account.active: true, order.priority: 3 }
  children:
    line:
      - { line.kind: GIFT }
exact: true
expect:
  feature: edge.precheck_reverse
  effect: RELEASE
  bundleVersion: "sha256:27903b3197b5a3efc2948383605beafac375ed4f434e54ca8fd35c0ae867e1a1"
  skippedScopes: []
  binding: { level: global }
  policy: main
  reason: { type: RULE, id: gift-release, name: "A line is a gift" }
  trace:
    - { id: gift-release, matched: true }
