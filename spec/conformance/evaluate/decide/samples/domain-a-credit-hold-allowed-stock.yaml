id: decide/samples/domain-a-credit-hold-allowed-stock
specVersion: "0.1"
clauses: [RULE-29, RULE-31, RULE-47, RULE-48, RULE-49, RULE-52, RULE-54, BIND-17, PROV-62, PROV-68, PROV-71, PROV-74, PROV-78, PROV-80, PROV-83, PROV-18, PROV-64, PROV-65, PROV-69, PROV-73, BIND-16, PROV-70, PROV-7, RULE-53, PROV-79, PROV-82, RULE-55, PROV-81]
description: "Sample domain A: on a credit hold, a basket whose every item is an allowed stock type is allowed by the second rule, after the first rule fails."
call: decide
bundle: ../../../bundles/commerce.json
context: { levels: { division: south } }
feature: checkout.order_submission
input:
  facts: { customer.active: true, customer.credit_hold: true }
  children:
    item:
      - { item.stock_type: STOCKED }
      - { item.stock_type: SPECIAL_ORDER }
exact: true
expect:
  feature: checkout.order_submission
  effect: ALLOW
  bundleVersion: "sha256:ab1cd3a96be4ab7569ccaba61cb65dbd14b5efd8239de35f16643ab791af6859"
  skippedScopes: []
  binding: { level: division, node: south }
  policy: credit_check
  reason: { type: RULE, id: credit-hold-allowed-stock, name: "On credit hold, every item is an allowed stock type" }
  trace:
    - { id: good-credit, matched: false, failed: { fact: customer.credit_hold, op: eq } }
    - { id: credit-hold-allowed-stock, matched: true }
