id: decide/samples/domain-b-same-basket-standard-approved
specVersion: "0.1"
clauses: [RULE-31, RULE-47, RULE-48, RULE-49, RULE-52, RULE-54, RULE-55, RULE-27, BIND-16, BIND-17, BIND-18, BIND-23, PROV-62, PROV-68, PROV-69, PROV-71, PROV-74, PROV-78, PROV-80, PROV-82, PROV-83, PROV-18, PROV-64, PROV-65, PROV-73, PROV-7, RULE-53, PROV-79, RULE-29, PROV-81, RULE-32]
description: "Sample domain B: the same mixed basket at meadow_square has no store binding, so the platform binding applies and its standard policy approves it through the cash rule."
call: decide
bundle: ../../../bundles/retail-pos.json
context: { levels: { store: meadow_square } }
feature: pos.basket_check
input:
  facts: { basket.tender: CASH, shopper.fraud_flag: false, shopper.tier: STANDARD }
  children:
    line:
      - { line.category: GROCERY }
      - { line.category: GENERAL }
exact: true
expect:
  feature: pos.basket_check
  effect: APPROVE
  bundleVersion: "sha256:5acebbd8528de939c2ca351ef15f2845f9d156eb6c4f275c57501c9edb039df0"
  skippedScopes: []
  binding: { level: platform }
  policy: standard
  reason: { type: RULE, id: cash-simple-basket, name: "A cash basket of cash categories is approved" }
  trace:
    - { id: flagged-shopper, matched: false, failed: { fact: shopper.fraud_flag, op: eq } }
    - { id: restricted-line, matched: false, failed: { fact: line.category, op: any_in } }
    - { id: cash-simple-basket, matched: true }
