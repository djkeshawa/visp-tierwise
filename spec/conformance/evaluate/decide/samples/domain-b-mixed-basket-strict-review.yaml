id: decide/samples/domain-b-mixed-basket-strict-review
specVersion: "0.1"
clauses: [RULE-8, RULE-31, RULE-32, RULE-50, RULE-51, RULE-52, RULE-54, RULE-55, BIND-17, BIND-18, BIND-21, PROV-62, PROV-68, PROV-71, PROV-73, PROV-75, PROV-78, PROV-80, PROV-82, PROV-18, PROV-64, PROV-65, PROV-69, BIND-16, PROV-70, PROV-7, RULE-53, PROV-79, RULE-29, PROV-81]
description: "Sample domain B: a mixed basket at harbor_street, under the restrictive strict policy, is not approved and takes its default REVIEW, the non-approved effect of this returns list, with all three rules traced."
call: decide
bundle: ../../../bundles/retail-pos.json
context: { levels: { store: harbor_street } }
feature: pos.basket_check
input:
  facts: { basket.tender: CASH, shopper.fraud_flag: false }
  children:
    line:
      - { line.category: GROCERY }
      - { line.category: GENERAL }
exact: true
expect:
  feature: pos.basket_check
  effect: REVIEW
  bundleVersion: "sha256:5acebbd8528de939c2ca351ef15f2845f9d156eb6c4f275c57501c9edb039df0"
  skippedScopes: []
  binding: { level: store, node: harbor_street }
  policy: strict
  reason: { type: DEFAULT }
  trace:
    - { id: flagged-shopper, matched: false, failed: { fact: shopper.fraud_flag, op: eq } }
    - { id: restricted-line, matched: false, failed: { fact: line.category, op: any_in } }
    - { id: cash-simple-basket, matched: false, failed: { fact: line.category, op: all_in } }
