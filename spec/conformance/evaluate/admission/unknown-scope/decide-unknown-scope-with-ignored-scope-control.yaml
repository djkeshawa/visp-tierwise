id: "admission/unknown-scope/decide-unknown-scope-with-ignored-scope-control"
specVersion: "0.1"
clauses: [CTX-14, CTX-16]
description: "Without the undeclared level the unlisted site node is skipped in decide."
call: decide
bundle: "../../../bundles/edge-admission.json"
context: { levels: { site: site_999 } }
feature: edge.route
input: { facts: { order.paid: true } }
expect:
  effect: SHIP
  skippedScopes: [{ scope: level, name: site, node: site_999, reason: UNKNOWN_NODE }]
  binding: { level: global }
  policy: paid_only
  reason: { type: RULE, id: paid, name: "Order is paid" }
  trace: [{ id: paid, matched: true }]
