id: "admission/context-shape/decide-open-control-character-control"
specVersion: "0.1"
clauses: [CTX-13, SVC-22]
description: "Without the control character the open node is admitted, and decide makes no provider call for it."
call: decide
bundle: "../../../bundles/edge-admission.json"
context: { levels: { account: xy } }
feature: edge.route
input: { facts: { order.paid: true } }
expect:
  effect: SHIP
  skippedScopes: []
  binding: { level: global }
  policy: paid_only
  reason: { type: RULE, id: paid, name: "Order is paid" }
  trace: [{ id: paid, matched: true }]
  providerCalls: { account: { xy: 0 } }
