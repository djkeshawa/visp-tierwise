id: "admission/context-shape/decide-integer-node-id-under-ignore-control"
specVersion: "0.1"
clauses: [CTX-14, CTX-16, CTX-18]
description: "The same value written as the string 7 is an unlisted node ID, so decide skips the site scope."
call: decide
bundle: "../../../bundles/edge-admission.json"
context: { levels: { site: "7" } }
feature: edge.route
input: { facts: { order.paid: true } }
expect:
  effect: SHIP
  skippedScopes: [{ scope: level, name: site, node: "7", reason: UNKNOWN_NODE }]
  binding: { level: global }
  policy: paid_only
  reason: { type: RULE, id: paid, name: "Order is paid" }
  trace: [{ id: paid, matched: true }]
