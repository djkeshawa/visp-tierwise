id: "admission/order/resolve-invalid-later-unknown-scope-before-provider"
specVersion: "0.1"
clauses: [CTX-4, CTX-9, CTX-10]
description: "An undeclared level later in the context is rejected before the partner provider is called."
call: resolve
bundle: "../../../bundles/edge-admission.json"
context: { levels: { partner: p-1, warehouse: south } }
key: edge.enabled
providers: { partner: { p-1: { values: { edge.enabled: true, edge.max_items: 20, edge.min_qty: 3 } } } }
expect: { error: E_UNKNOWN_SCOPE, providerCalls: { partner: { p-1: 0 } } }
