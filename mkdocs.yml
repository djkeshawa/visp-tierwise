      - CLI reference: guides/cli-reference.md
      - Runtime and operations: guides/runtime-and-operations.md
      - Server guide: guides/server.md
      - OpenFeature guide: guides/openfeature.md
      - Security model: guides/security-model.md
      - API reference: guides/api-reference.md
  - Reference:
      - OpenFeature mapping: openfeature-mapping.md
      - Benchmarks: benchmarks.md
      - Java core design: design/java-core.md
  - Project:
      - Vision and strategy: vision.md
      - Requirements: requirements.md
      - Roadmap: roadmap.md
      - Release 0.1.0 checklist: release-0.1.0-checklist.md
      - Release process: release-process.md
      - Open questions: open-questions.md
      - Contributing: contributing.md
      - RFC template: rfc-template.md
  - Decisions:
