site_name: Tierwise
site_description: Typed, layered configuration and entity-aware decisions with provenance, for Java and JavaScript
docs_dir: docs

# Built in CI only (.github/workflows/docs.yml): pip install -r docs/requirements-docs.txt, then mkdocs build --strict.
# No site_url yet: the project owner has not decided where the site is hosted (open question O2).

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - toc.follow
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: false
  - pymdownx.superfences

# These files are tooling, not pages. docs/tools holds the TypeDoc project, and its node_modules must not be copied
# into the site.
exclude_docs: |
  requirements-docs.txt
  tools/

# Every file under docs/ is in the navigation below, and a page that is not listed fails the build. A link from a page
# to a file outside docs/ (the changelog, a workflow, a source file) works in the repository and not on the site, so it
# is reported at info level and not as a failure; every link between pages of the site is still checked.
validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: info
    absolute_links: warn
    unrecognized_links: info
    anchors: info

nav:
  - Overview: index.md
  - Get started:
      - "Quickstart: Java": quickstart-java.md
      - "Quickstart: JavaScript": quickstart-js.md
  - Guides:
      - Guides: guides/index.md
