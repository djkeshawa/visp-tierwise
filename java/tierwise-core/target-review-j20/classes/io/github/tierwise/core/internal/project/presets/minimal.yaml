# tierwise:minimal
#
# Built-in preset for trying Tierwise out. It declares no kinds and no naming
# patterns. Its lint settings cover only the likely bugs of requirements section 6.3.
# The rules set to "off" are listed explicitly so that they override any earlier
# preset in the extends list (MANIFEST-31, LINT-4). Rules that no setting names are
# off as well (LINT-5). See README.md in this directory.

lint:
  rules:
    "naming/*": "off"
    values/no-op: warn
    rules/dead-rule: warn
    examples/required-per-binding: "off"
    examples/mixed-collection: "off"
    schema/unused: "off"
    schema/description-required: "off"
    schema/owner-required: "off"
    presets/override: info
